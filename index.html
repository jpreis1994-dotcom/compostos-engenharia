<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compostos Engenharia</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* ── RESET & BASE ─────────────────────────────────────── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --azul: #1A3C5E; --azul2: #2A6DBF; --azul3: #E8F0F8;
            --verde: #1A8F5A; --verde-bg: #E8F5E9;
            --vermelho: #D64045; --vermelho-bg: #FFEBEE;
            --amarelo: #E8A020; --amarelo-bg: #FFF8E1;
            --cinza: #7B8FA1; --cinza-bg: #F5F6FA; --cinza-borda: #E0E6ED;
            --branco: #FFFFFF; --texto: #1A2A3A;
            --shadow: 0 2px 8px rgba(0,0,0,0.08); --radius: 10px;
            --font: 'Inter', system-ui, sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: var(--font); background: var(--cinza-bg); color: var(--texto); height: 100vh; display: flex; overflow: hidden; }
        
        /* ── SIDEBAR ──────────────────────────────────────────── */
        #sidebar { width: 230px; min-width: 230px; background: linear-gradient(180deg, #1A3C5E 0%, #0F2744 100%); display: flex; flex-direction: column; padding: 0; overflow: hidden; box-shadow: 2px 0 12px rgba(0,0,0,0.15); }
        .sidebar-logo { padding: 20px 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .sidebar-logo .empresa { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 6px; letter-spacing: .5px; font-weight: 700; text-transform: uppercase; }
        .sidebar-user { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-user .nome { font-size: 13px; font-weight: 600; color: white; }
        .sidebar-user .perfil { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }
        nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
        nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: rgba(255,255,255,0.65); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; margin-bottom: 2px; text-decoration: none; }
        nav a:hover { background: rgba(255,255,255,0.08); color: white; }
        nav a.active { background: rgba(255,255,255,0.14); color: white; }
        nav a .ico { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-footer { padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.08); }
        .btn-logout { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .15s; }
        .btn-logout:hover { background: rgba(255,255,255,0.08); color: white; }
        
        /* ── MAIN LAYOUT ──────────────────────────────────────── */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { background: white; border-bottom: 1px solid var(--cinza-borda); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .topbar-title { font-size: 18px; font-weight: 700; color: var(--azul); }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        #content { flex: 1; overflow-y: auto; padding: 24px; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--cinza-borda); padding: 20px 24px; margin-bottom: 16px; }
        .card-title { font-size: 13px; font-weight: 600; color: var(--azul); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
        .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
        .kpi { background: white; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--cinza-borda); padding: 16px 20px; }
        .kpi-label { font-size: 11px; color: var(--cinza); text-transform: uppercase; margin-bottom: 6px; font-weight: 500; }
        .kpi-val { font-size: 20px; font-weight: 700; color: var(--azul); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-val.verde { color: var(--verde); }
        .kpi-val.vermelho { color: var(--vermelho); }
        .kpi-val.azul { color: var(--azul2); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .table-wrap { overflow-x: auto; margin-top: 10px; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { font-size: 11px; font-weight: 600; color: var(--cinza); text-transform: uppercase; padding: 10px 12px; border-bottom: 2px solid var(--cinza-borda); background: white; position: sticky; top: 0; text-align: left; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--cinza-borda); color: var(--texto); }
        tr:hover td { background: #FAFBFC; }
        .td-num { text-align: right; font-weight: 600; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-verde { background: var(--verde-bg); color: #1B6B3A; }
        .badge-azul { background: var(--azul3); color: var(--azul2); }
        .badge-vermelho { background: var(--vermelho-bg); color: #B71C1C; }
        .badge-amarelo { background: var(--amarelo-bg); color: #7B5500; }
        .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--azul); color: white; }
        .btn-primary:hover { background: var(--azul2); }
        .btn-success { background: var(--verde); color: white; }
        .btn-outline { background: white; color: var(--azul); border: 1px solid var(--azul); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .filters { display: flex; gap: 10px; background: white; padding: 12px; border-radius: 8px; border: 1px solid var(--cinza-borda); margin-bottom: 14px; }
        select, input, textarea { border: 1px solid var(--cinza-borda); border-radius: 7px; padding: 7px 10px; font-size: 13px; outline: none; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; color: var(--cinza); font-weight: 500; }
        .span2 { grid-column: span 2; }
        
        /* ── LOGIN SCREEN ─────────────────────────────────────── */
        #login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1A3C5E 0%, #0F2744 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; border-radius: 16px; padding: 40px; width: 380px; box-shadow: 0 24px 64px rgba(0,0,0,0.3); }
        .login-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--azul); margin-bottom: 4px; }
        .login-sub { text-align: center; font-size: 13px; color: var(--cinza); margin-bottom: 24px; }
        .btn-login { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; margin-top: 12px; }
        .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .alert-danger { background: var(--vermelho-bg); color: #B71C1C; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-title">Compostos Engenharia</div>
    <div class="login-sub">Painel de Gestão Integrado</div>
    <div class="login-form">
      <div class="form-group" style="margin-bottom:14px">
        <label>Usuário</label>
        <input type="text" id="login-user" placeholder="hugo ou joao">
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label>Senha</label>
        <input type="password" id="login-pass" placeholder="Sua senha">
      </div>
      <div id="login-erro" class="alert alert-danger hidden">Usuário ou senha incorretos.</div>
      <button class="btn btn-primary btn-login" onclick="doLogin()">Entrar</button>
    </div>
  </div>
</div>

<div id="app-shell" style="display:none; flex:1; width:100%; height:100vh">
  <div id="sidebar">
    <div class="sidebar-logo">
      <div style="font-size:24px; color:white">🔧</div>
      <div class="empresa" style="color:white; font-weight:700; margin-top:5px; font-size:12px;">COMPOSTOS ENGENHARIA</div>
    </div>
    <div class="sidebar-user">
      <div class="nome" id="sb-nome">—</div>
      <div class="perfil" id="sb-perfil">—</div>
    </div>
    <nav>
      <a onclick="nav('dashboard')" id="nav-dashboard" class="active"><span class="ico">📊</span> Dashboard</a>
      <a onclick="nav('orcamentos')" id="nav-orcamentos"><span class="ico">📝</span> Orçamentos</a>
      <a onclick="nav('os')" id="nav-os"><span class="ico">🔧</span> Ordens de Serviço</a>
      <a onclick="nav('fluxo')" id="nav-fluxo"><span class="ico">💰</span> Fluxo de Caixa</a>
      <a onclick="nav('receber')" id="nav-receber"><span class="ico">📋</span> Contas a Receber</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="doLogout()">🚪 Sair</button>
    </div>
  </div>

  <div id="main">
    <div class="topbar">
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-right"><span class="text-sm text-muted" id="topbar-date"></span></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIGURAÇÃO CENTRALIZADA DO BANCO SUPABASE REAL
// ══════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://stfebxsmovcnlyzpcsoa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0ZmVieHNtb3Zjbmx5enBjc29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTgyNjYsImV4cCI6MjA5NTAzNDI2Nn0.Oo8HQ9UA4RmTaPv-W8zgw0x3IV1PlOoOTuFZNfUd3mk';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Memória local cacheada para renderização das telas
let DATA_REAL = { os: [], fluxo: [], receber: [], tipos_servico: [] };

// ── FORMATADORES E COMPONENTES VISUAIS ───────────────────────────────────────
function fmtBRL(v) { return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtData(d) { if(!d) return '—'; const p = d.split('T')[0].split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }

function badge(status) {
    let c = 'badge-azul';
    let s = String(status).toUpperCase().trim();
    if (['RECEBIDO','FINALIZADO','PAGO','CONCLUÍDA','FATURADA','OK'].includes(s)) c = 'badge-verde';
    if (['EM ATRASO','VENCIDA'].includes(s)) c = 'badge-vermelho';
    if (['A EXECUTAR','EM ABERTO','EM EXECUÇÃO','VENCE HOJE'].includes(s)) c = 'badge-amarelo';
    return `<span class="badge ${c}">${status}</span>`;
}

// ── CARREGAMENTO DE DADOS EM TEMPO REAL (SUPABASE) ───────────────────────────
async function carregarDadosDoSupabase() {
    try {
        // 1. Puxa fluxo de caixa
        const resFluxo = await supabaseClient.from('fluxo_caixa').select('*').order('data_movimento', { ascending: false });
        if (!resFluxo.error) DATA_REAL.fluxo = resFluxo.data || [];

        // 2. Puxa ordens de serviço
        const resOS = await supabaseClient.from('ordens_servico').select('*').order('numero_os', { ascending: false });
        if (!resOS.error) DATA_REAL.os = resOS.data || [];

        // 3. Puxa contas a receber
        const resReceber = await supabaseClient.from('contas_receber').select('*').order('vencimento', { ascending: true });
        if (!resReceber.error) DATA_REAL.receber = resReceber.data || [];

        // 4. Puxa tipos de serviço cadastrados
        const resTipos = await supabaseClient.from('tipos_servico').select('*').order('nome', { ascending: true });
        if (!resTipos.error) DATA_REAL.tipos_servico = resTipos.data || [];

    } catch (err) {
        console.error("Erro crítico na sincronização com Supabase:", err);
    }
}

// ── AUTENTICAÇÃO DO PAINEL ───────────────────────────────────────────────────
function doLogin() {
    const u = document.getElementById('login-user').value.trim().toLowerCase();
    const s = document.getElementById('login-pass').value;
    
    if ((u === 'hugo' && s === 'compostos2024') || (u === 'joao' && s === 'financeiro2024')) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-shell').style.display = 'flex';
        document.getElementById('sb-nome').textContent = u === 'hugo' ? 'HUGO VELOSO SOARES' : 'JOÃO PEDRO REIS';
        document.getElementById('sb-perfil').textContent = u === 'hugo' ? 'DONO / ENG' : 'FINANCEIRO';
        document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
        nav('dashboard');
    } else {
        document.getElementById('login-erro').classList.remove('hidden');
    }
}

function doLogout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-shell').style.display = 'none';
}

function atualizarEscopoDoServico() {
    const select = document.getElementById('orc-servico-id');
    const opt = select.options[select.selectedIndex];
    if(!opt.value) return;
    document.getElementById('orc-desc-visual').value = opt.getAttribute('data-desc') || '';
    document.getElementById('orc-prazo-exec').value = opt.getAttribute('data-exec') || 'A combinar';
    document.getElementById('orc-prazo-laudo').value = opt.getAttribute('data-laudo') || 'A combinar';
    document.getElementById('orc-validade').value = opt.getAttribute('data-validade') || '15 dias';
}

// ── SISTEMA DE NAVEGAÇÃO DINÂMICA ───────────────────────────────────────────
async function nav(page) {
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    document.getElementById('nav-'+page)?.classList.add('active');
    document.getElementById('page-title').textContent = page.toUpperCase();
    
    const content = document.getElementById('content');
    content.innerHTML = '<div style="padding:40px; text-align:center; color:#7B8FA1;">🔄 Atualizando dados com a nuvem da Compostos...</div>';

    // Garante dados frescos direto do banco antes de renderizar a tela
    await carregarDadosDoSupabase();
    content.innerHTML = '';

    if (page === 'dashboard') {
        // Cálculos baseados nos inserts reais que você fez
        const recTotal = DATA_REAL.fluxo.filter(x => x.tipo === 'RECEITA').reduce((a,b)=>a+Number(b.valor),0);
        const despTotal = DATA_REAL.fluxo.filter(x => x.tipo === 'DESPESA').reduce((a,b)=>a+Number(b.valor),0);
        const aRec = DATA_REAL.receber.filter(x => ['A VENCER','VENCE HOJE'].includes(String(x.status).toUpperCase())).reduce((a,b)=>a+Number(b.valor),0);
        const atraso = DATA_REAL.receber.filter(x => String(x.status).toUpperCase() === 'EM ATRASO').reduce((a,b)=>a+Number(b.valor),0);

        content.innerHTML = `
            <div class="kpis">
                <div class="kpi"><div class="kpi-label">💰 Entradas Acumuladas</div><div class="kpi-val verde">${fmtBRL(recTotal)}</div></div>
                <div class="kpi"><div class="kpi-label">📤 Despesas Pagas</div><div class="kpi-val vermelho">${fmtBRL(despTotal)}</div></div>
                <div class="kpi"><div class="kpi-label">📈 Caixa Líquido Atual</div><div class="kpi-val">${fmtBRL(recTotal - despTotal)}</div></div>
                <div class="kpi"><div class="kpi-label">🔵 Carteira Futura</div><div class="kpi-val azul">${fmtBRL(aRec)}</div></div>
                <div class="kpi"><div class="kpi-label">⚠️ Inadimplência / Atrasos</div><div class="kpi-val vermelho">${fmtBRL(atraso)}</div></div>
            </div>
            <div class="grid-2">
                <div class="card"><div class="card-title">📊 Evolução Financeira</div><canvas id="c-chart-mes" height="140"></canvas></div>
                <div class="card">
                    <div class="card-title">🔧 Monitoramento de Frentes de Serviço Recentes</div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Nº OS</th><th>Cliente</th><th>Escopo</th><th>Status</th><th class="td-num">Total</th></tr></thead>
                            <tbody>
                                ${DATA_REAL.os.slice(0, 10).map(o => `<tr><td><b>#${o.numero_os}</b></td><td>${o.cliente_nome || '—'}</td><td>${o.servico || 'Geral'}</td><td>${badge(o.status)}</td><td class="td-num">${fmtBRL(o.valor_total)}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
        setTimeout(renderCharts, 100);

    } else if (page === 'orcamentos') {
        const lista = DATA_REAL.tipos_servico.length > 0 ? DATA_REAL.tipos_servico : [
            { id: 1, nome: "Teste de estanqueidade nos compartimentos de armazenamento", descricao_padrao: "Execução de ensaio pneumático não destrutivo em conformidade com as diretrizes da NBR 13784.", prazo_execucao: "2 dias úteis", prazo_laudo: "5 dias úteis", validade_proposta: "15 dias" }
        ];

        content.innerHTML = `
            <div class="card">
                <div class="card-title">📝 Emissão Espelhada de Orçamentos da Compostos</div>
                <div class="form-grid">
                    <div class="form-group span2">
                        <label>Busca Automática por CNPJ (Receita Federal)</label>
                        <div style="display:flex; gap:8px">
                            <input type="text" id="orc-cnpj" placeholder="Apenas números">
                            <button class="btn btn-outline" onclick="buscarCNPJReal()">🔍 Buscar Cadastro</button>
                        </div>
                    </div>
                    <div class="form-group span2"><label>Razão Social</label><input type="text" id="orc-razao"></div>
                    <div class="form-group"><label>Cidade</label><input type="text" id="orc-cidade"></div>
                    <div class="form-group"><label>UF</label><input type="text" id="orc-uf" maxlength="2"></div>
                    
                    <div class="form-group span2">
                        <label>Selecionar Tipo de Serviço Técnico (Base real)</label>
                        <select id="orc-servico-id" onchange="atualizarEscopoDoServico()">
                            <option value="" disabled selected>Escolha o serviço...</option>
                            ${lista.map(s => `
                                <option value="${s.id}" data-desc="${s.descricao_padrao || ''}" data-exec="${s.prazo_execucao || 'A combinar'}" data-laudo="${s.prazo_laudo || 'A combinar'}" data-validade="${s.validade_proposta || '15 dias'}">
                                    ${s.nome}
                                </option>
                            `).join('')}
                        </select>
                    </div>
                    
                    <div class="form-group span2">
                        <label>Descrição Técnica Padrão do Laudo</label>
                        <textarea id="orc-desc-visual" rows="4" readonly style="background:#FAFBFB; color:#4A5568; resize:none; font-size:12.5px;"></textarea>
                    </div>
                    
                    <div class="form-grid-3 span2">
                        <div class="form-group"><label>Prazo Execução</label><input type="text" id="orc-prazo-exec" readonly style="background:#FAFBFB;"></div>
                        <div class="form-group"><label>Prazo Laudo</label><input type="text" id="orc-prazo-laudo" readonly style="background:#FAFBFB;"></div>
                        <div class="form-group"><label>Validade da Proposta</label><input type="text" id="orc-validade" readonly style="background:#FAFBFB;"></div>
                    </div>

                    <div class="form-group"><label>Quantidade</label><input type="number" id="orc-qtd" value="1"></div>
                    <div class="form-group"><label>Valor Unitário (R$)</label><input type="number" id="orc-val" value="0" step="0.01"></div>
                </div>
                <button class="btn btn-primary" style="margin-top:20px" onclick="gerarOrcamentoPDFReal()">📄 Exportar Proposta Comercial Avançada em PDF</button>
            </div>
        `;
    } else if (page === 'os') {
        content.innerHTML = `
            <div class="card">
                <div class="card-title">🔧 Painel de Controle de Ordens de Serviço (Dados Reais da Nuvem)</div>
                <div class="filters">
                    <input type="number" id="new-os-num" placeholder="Nº da OS" style="width:110px">
                    <input type="text" id="new-os-cli" placeholder="Nome do Cliente">
                    <input type="number" id="new-os-val" placeholder="Valor Total (R$)">
                    <button class="btn btn-primary" onclick="addOSReal()">＋ Criar Nova OS</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Nº OS</th><th>Cliente</th><th>Escopo Operacional</th><th>Status</th><th class="td-num">Valor Acertado</th></tr></thead>
                        <tbody>
                            ${DATA_REAL.os.map(o => `
                                <tr>
                                    <td><b>#${o.numero_os}</b></td>
                                    <td>${o.cliente_nome || '—'}</td>
                                    <td>${o.servico || 'INSPEÇÃO TÉCNICA'}</td>
                                    <td>${badge(o.status || 'EM EXECUÇÃO')}</td>
                                    <td class="td-num">${fmtBRL(o.valor_total)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    } else if (page === 'receber') {
        content.innerHTML = `
            <div class="card">
                <div class="card-title">📋 Carteira de Cobrança e Contas a Receber</div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Nº OS</th><th>Cliente</th><th>Data Vencimento</th><th>Meio</th><th class="td-num">Valor Parcela</th><th>Status</th></tr></thead>
                        <tbody>
                            ${DATA_REAL.receber.map(r => `<tr>
                                <td>#${r.os_id || '—'}</td><td>${r.cliente_nome || 'Cliente Geral'}</td><td>${fmtData(r.vencimento)}</td><td>${r.forma_pagamento || 'Boleto'}</td><td class="td-num">${fmtBRL(r.valor)}</td><td>${badge(r.status)}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    } else if (page === 'fluxo') {
        content.innerHTML = `
            <div class="card">
                <div class="card-title">💰 Extrato Geral Histórico do Fluxo de Caixa</div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Data Movimento</th><th>Natureza</th><th>Cliente / Destino</th><th>Categoria Técnica</th><th class="td-num">Valor Líquido</th></tr></thead>
                        <tbody>
                            ${DATA_REAL.fluxo.map(f => `<tr>
                                <td>${fmtData(f.data_movimento)}</td><td>${badge(f.tipo)}</td><td>${f.cliente}</td><td>${f.categoria || 'Geral'}</td>
                                <td class="td-num ${f.tipo==='RECEITA'?'verde':'vermelho'}">${fmtBRL(f.valor)}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }
}

// ── REQUISIÇÕES EXTRA - APIS EXTERNAS ────────────────────────────────────────
async function buscarCNPJReal() {
    const cnpj = document.getElementById('orc-cnpj').value.replace(/\D/g,'');
    if(cnpj.length !== 14) { alert('Digite os 14 números do CNPJ.'); return; }
    try {
        const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
        const data = await response.json();
        if(data.razao_social) {
            document.getElementById('orc-razao').value = data.razao_social;
            document.getElementById('orc-cidade').value = data.municipio;
            document.getElementById('orc-uf').value = data.uf;
        } else { alert('CNPJ não localizado.'); }
    } catch { alert('Erro ao consultar API de CNPJ.'); }
}

async function addOSReal() {
    const num = document.getElementById('new-os-num').value;
    const cli = document.getElementById('new-os-cli').value;
    const val = parseFloat(document.getElementById('new-os-val').value);

    if(!num || !cli || !val){ alert('Preencha os campos operacionais.'); return; }

    try {
        const { error } = await supabaseClient.from('ordens_servico').insert([{
            numero_os: parseInt(num),
            cliente_nome: cli,
            servico: 'INSPEÇÃO OPERACIONAL',
            status: 'EM EXECUÇÃO',
            valor_total: val,
            data_abertura: new Date().toISOString().slice(0,10)
        }]);

        if(error) throw error;
        alert('Ordem de serviço gravada com sucesso!');
        nav('os');
    } catch (e) {
        alert('Erro ao persistir nova OS.');
    }
}

function renderCharts() {
    const canvas = document.getElementById('c-chart-mes');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');

    // Agrupamento básico automático dos meses reais inseridos (Março e Abril)
    const recMarco = DATA_REAL.fluxo.filter(x => x.tipo === 'RECEITA' && x.data_movimento.includes('-03-')).reduce((a,b)=>a+Number(b.valor),0);
    const despMarco = DATA_REAL.fluxo.filter(x => x.tipo === 'DESPESA' && x.data_movimento.includes('-03-')).reduce((a,b)=>a+Number(b.valor),0);
    const recAbril = DATA_REAL.fluxo.filter(x => x.tipo === 'RECEITA' && x.data_movimento.includes('-04-')).reduce((a,b)=>a+Number(b.valor),0);
    const despAbril = DATA_REAL.fluxo.filter(x => x.tipo === 'DESPESA' && x.data_movimento.includes('-04-')).reduce((a,b)=>a+Number(b.valor),0);

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Março/2026', 'Abril/2026'],
            datasets: [
                { label: 'Faturamento / Entradas', data: [recMarco, recAbril], backgroundColor: '#1A8F5A', borderRadius: 4 },
                { label: 'Despesas / Saídas', data: [despMarco, despAbril], backgroundColor: '#D64045', borderRadius: 4 }
            ]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });
}
</script>
