
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compostos Engenharia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

#login{
    width:320px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    background:#16324F;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

#app{
    display:none;
}

.sidebar{
    width:220px;
    background:#16324F;
    color:white;
    height:100vh;
    position:fixed;
    padding:20px;
}

.content{
    margin-left:240px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border-bottom:1px solid #ddd;
    padding:10px;
}

</style>

</head>
<body>

<div id="login">

    <h2>Compostos ERP</h2>

    <input id="user" placeholder="Usuário">

    <input id="pass" type="password" placeholder="Senha">

    <button onclick="doLogin()">
        Entrar
    </button>

</div>

<div id="app">

    <div class="sidebar">

        <h2>COMPOSTOS</h2>

        <button onclick="carregarDashboard()">
            Dashboard
        </button>

        <br><br>

        <button onclick="carregarOS()">
            Ordens de Serviço
        </button>

    </div>

    <div class="content" id="content"></div>

</div>

<script>

const SUPABASE_URL = 'https://stfebxsmovcnlyzpcsoa.supabase.co';

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInR5cCI6IkpXVCJ9';

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function doLogin(){

    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;

    if(
        (user === 'joao' && pass === 'financeiro2024')
        ||
        (user === 'hugo' && pass === 'compostos2024')
    ){

        document.getElementById('login').style.display = 'none';

        document.getElementById('app').style.display = 'block';

        carregarDashboard();

    }else{

        alert('Login inválido');

    }

}

function carregarDashboard(){

    document.getElementById('content').innerHTML = `

        <div class="card">

            <h2>Dashboard</h2>

            <p>
                Sistema funcionando corretamente.
            </p>

        </div>

    `;

}

async function carregarOS(){

    const { data, error } = await supabaseClient
        .from('ordens_servico')
        .select('*');

    if(error){

        console.error(error);

        alert('Erro Supabase');

        return;
    }

    let linhas = '';

    data.forEach(os => {

        linhas += `

            <tr>

                <td>${os.id || ''}</td>

                <td>${os.cliente_nome || ''}</td>

                <td>${os.status || ''}</td>

                <td>${os.valor_total || ''}</td>

            </tr>

        `;

    });

    document.getElementById('content').innerHTML = `

        <div class="card">

            <h2>Ordens de Serviço</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Status</th>
                        <th>Valor</th>
                    </tr>

                </thead>

                <tbody>

                    ${linhas}

                </tbody>

            </table>

        </div>

    `;

}

</script>

</body>
</html>
